<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Birthday</title>
<style>
  :root {
    --pink: #f7c5d5;
    --ink: #4a2433;
    --card-ink: #3b2a30;
    --muted: #8a6f78;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }

  /* ---------- Terminal page ---------- */
  #terminal {
    position: fixed; inset: 0;
    background: var(--pink);
    color: var(--ink);
    font-family: "SF Mono", "Fira Code", Menlo, Consolas, monospace;
    font-size: clamp(18px, 3.2vw, 28px);
    padding: 12vh 8vw;
    cursor: pointer;
    transition: opacity .8s ease;
  }
  #terminal.hide { opacity: 0; pointer-events: none; }
  .line { margin: 0 0 .8em; white-space: pre-wrap; }
  .caret { margin-right: .6em; }
  .cursor {
    display: inline-block; width: .6em; height: 1.1em;
    background: var(--ink); vertical-align: text-bottom;
    margin-left: 2px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Card page ---------- */
  #card-page {
    position: fixed; inset: 0;
    background: #fff;
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
    overflow-y: auto;
    padding-top: max(24px, env(safe-area-inset-top, 0px));
    padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
  }
  #card-page.show { display: flex; }
  .card {
    max-width: 480px; width: 100%;
    text-align: center;
    color: var(--card-ink);
    font-family: Georgia, "Times New Roman", serif;
  }
  .card img { width: 220px; max-width: 70%; height: auto; margin-bottom: 8px; }
  .card h1 { font-size: clamp(30px, 6vw, 42px); font-weight: 400; margin: 0 0 20px; line-height: 1.15; }
  .card p { font-size: 19px; line-height: 1.7; margin: 0 0 22px; }
  .card .sign { color: var(--muted); font-style: italic; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
    #terminal { transition: none; }
  }
</style>
</head>
<body>

<div id="terminal" aria-live="polite" title="Click to skip"></div>

<div id="card-page">
  <div class="card">
    <img src="penguin.png" alt="A penguin holding a basket of hearts">
    <h1 id="card-title"></h1>
    <p id="card-message"></p>
    <p class="sign" id="card-sign"></p>
  </div>
</div>

<script>
/* ============================================================
   EDIT YOUR TEXT HERE
   ============================================================ */
const TEXT = {
  // Terminal intro: each string is typed on its own line after a ">"
  terminalLines: [
    "it's your birthday!",
    "I'm excited for a new year with you."
  ],

  // The card
  cardTitle:   "Happy Birthday!",
  cardMessage: "I'm very lucky to be able to do life with you. You're my favorite person," +
               "and the one that I want to tell when something happens to me. I wish you the best this year," +
               "and I am excited to make many more memories with you! I love you the most.",
  cardSign:    "Love, Sahana"
};

const TYPING_SPEED_MS = 70;     // lower = faster
const PAUSE_BETWEEN_LINES_MS = 600;
const PAUSE_BEFORE_CARD_MS = 1500;
/* ============================================================ */

const terminal = document.getElementById("terminal");
const cardPage = document.getElementById("card-page");
let done = false;

document.getElementById("card-title").textContent = TEXT.cardTitle;
document.getElementById("card-message").textContent = TEXT.cardMessage;
document.getElementById("card-sign").textContent = TEXT.cardSign;

function showCard() {
  if (done) return;
  done = true;
  terminal.classList.add("hide");
  cardPage.classList.add("show");
  setTimeout(() => terminal.remove(), 900);
}
terminal.addEventListener("click", showCard);

const sleep = ms => new Promise(r => setTimeout(r, ms));

async function run() {
  const cursor = document.createElement("span");
  cursor.className = "cursor";

  for (const text of TEXT.terminalLines) {
    if (done) return;
    const line = document.createElement("div");
    line.className = "line";
    const caret = document.createElement("span");
    caret.className = "caret";
    caret.textContent = ">";
    const typed = document.createElement("span");
    line.append(caret, typed, cursor);
    terminal.appendChild(line);

    for (const ch of text) {
      if (done) return;
      typed.textContent += ch;
      await sleep(TYPING_SPEED_MS);
    }
    await sleep(PAUSE_BETWEEN_LINES_MS);
  }
  await sleep(PAUSE_BEFORE_CARD_MS);
  showCard();
}
run();
</script>
</body>
</html>
